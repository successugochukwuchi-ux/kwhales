{% extends 'shop/base.html' %}

{% block title %}Login - Online Store{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 3rem auto;">
    <div style="background: var(--light-gray); padding: 2rem; border-radius: 8px;">
        <h1 style="color: var(--secondary-color); text-align: center; margin-bottom: 1.5rem;">Login</h1>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Don't have an account? <a href="#" style="color: var(--primary-color);">Register</a>
        </p>
    </div>
</div>
{% endblock %}
